name: koy_koy_koy
description: A smart expense tracker with auto-categorization and budget alerts.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

  # Charts
  fl_chart: ^0.68.0

  # Formatting / localization
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  drift_dev: ^2.16.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true # enables lib/l10n ARB -> Dart codegen (see l10n.yaml)



  assets:
    - assets/fonts/